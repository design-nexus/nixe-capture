[package]
name = "settings"
version = "0.5.0"
description = "A control panel for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/omarchy-settings"
authors = ["Ken Smith"]
edition = "2024"
default-run = "settings"

[dependencies]
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
strip = true
