[package]
name = "nexus-office"
version = "0.2.0"
description = "Nexus Write, Sheets and Present: documents, spreadsheets and slides for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nexus-office-suite"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nexus-office"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libspelling = "0.5"
pangocairo = "0.22"
roxmltree = "0.21"
rust_xlsxwriter = { version = "0.99", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourceview5 = "0.11"
toml = "1.1.6"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
