[package]
name = "nexus-photos"
version = "0.3.0"
description = "A fast, keyboard-first photo gallery for Omarchy"
edition = "2024"

[[bin]]
name = "nexus-photos"
path = "src/main.rs"

[[bin]]
name = "nexus-photos-viewer"
path = "src/bin/nexus-photos-viewer.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
pangocairo = "0.22"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true
