[package]
name = "nexus-music"
version = "0.1.0"
description = "A music player for Omarchy: media library, playlists, equalizer and a live spectrum analyzer"
license = "MIT"
repository = "https://github.com/design-nexus/nexus-music"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "music"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
walkdir = "2.5"
zbus = "5"

[profile.release]
lto = "thin"
strip = true
