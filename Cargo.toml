[package]
name = "nexus-tasks"
version = "0.1.0"
description = "A task manager for Omarchy: processes, live performance graphs, startup items and services"
license = "MIT"
repository = "https://github.com/design-nexus/nexus-tasks"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "tasks"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[profile.release]
lto = "thin"
strip = true
