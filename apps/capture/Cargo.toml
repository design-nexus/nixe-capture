[package]
name = "nixe-capture"
version = "0.1.0"
description = "Screenshot, annotation, and OCR for Omarchy"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nixe-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
image = { version = "0.25", default-features = false, features = ["png"] }
gtk4-layer-shell = "0.8"
nixe-capture-core = { path = "../../crates/nixe-capture-core" }
nixe-core = { path = "../../crates/nixe-core" }
nixe-theme = { path = "../../crates/nixe-theme" }
nixe-ui = { path = "../../crates/nixe-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
